[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "amortised-adaptive-is"
version = "0.1.0"
description = "Amortised adaptive importance sampling experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.10.0",
  "matplotlib>=3.8",
  "pillow>=10.2",
  "hydra-core>=1.3",
  "POT>=0.9",
  "omegaconf>=2.3",
  "wandb>=0.16",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]


[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cu128"]

[dependency-groups]
test = [
  "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["amortised_adaptive_is"]
