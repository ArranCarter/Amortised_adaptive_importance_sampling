# The dataclass defaults in core/specs.py and learnt/train.TrainConfig.
# Edit the dataclass, then this file to match.
loss: rkl
step_weighting: uniform
cov: diag
learn_logits: false
sampling: stratified
use_grad_input: false
max_delta_logit: 1.0
hidden_dim: 32
use_log_pi: true
use_moments: true
use_global_w: true
delta_scale: sigma
max_delta_mu: 1.0
max_delta_log_sigma: 0.5
min_variance: 0.0001
max_variance: .inf
detach_between_steps: false
n_true_samples: 256
val_select: loss
n_epochs: 1000
lr: 0.003
lr_schedule: none
lr_min_factor: 0.05
feat_compress: clip
feat_scale: 5.0
scale_free: true
anneal_beta0: 1.0
anneal_frac: 0.5
anneal_shape: linear
checkpoint_every: 0
clip_grad_norm: 1.0
train_batch_size: 32
val_batch_size: 64
val_every: 25
seed: 100
val_seed: 20000
print_every: 100
